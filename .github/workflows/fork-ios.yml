name: Fork iOS build

# Compiles the fork's iPhone app unsigned on a hosted Mac, because upstream's
# native code needs a newer Xcode than the Mac that signs and installs it has.
# fork/ios.sh picks up the artifact. See fork/README.md.
on:
  push:
    branches: [stack]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      EXPO_NO_GIT_STATUS: "1"
      T3CODE_IOS_PERSONAL_TEAM: "1"
      T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: com.eduwass.t3code
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: corepack enable && pnpm install --frozen-lockfile --filter '@t3tools/mobile...'
      - name: Build
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --clean --platform ios
          workspace=$(echo ios/*.xcworkspace)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination generic/platform=iOS -derivedDataPath ios/build -quiet \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent "ios/build/Build/Products/Release-iphoneos/$scheme.app" "$RUNNER_TEMP/app.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: app
          path: ${{ runner.temp }}/app.zip
          retention-days: 30
