name: Fork Mac build

# Packages the fork's T3 Space desktop app, unsigned, on a hosted Mac.
# fork/mac.sh pushes the stack to mac/<nightly version> to start it; the name carries the version.
on:
  push:
    branches: ["mac/**"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...
      # A nightly version gives the "Nightly" label; public T3 Connect identifiers come from .env.example.
      - run: |
          node scripts/update-release-package-versions.ts "${GITHUB_REF_NAME#mac/}"
          cp .env.example .env
      - run: vp run dist:desktop:artifact --platform mac --target zip --arch arm64 --build-version "${GITHUB_REF_NAME#mac/}" --verbose
      - uses: actions/upload-artifact@v5
        with:
          name: mac-app
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
